# Yaguachi Weather · panel del analista (build de Vite servido por nginx; en compose solo escucha en 127.0.0.1)
# Registro sin IP ni parámetros de la URL (allí van coordenadas): la política de privacidad lo promete
log_format privado '$time_iso8601 "$request_method $uri" $status $body_bytes_sent';

server {
    access_log /dev/stdout privado;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # La API se resuelve por el DNS de Docker en cada petición (y no una sola vez al arrancar nginx):
    # así reconstruir o reiniciar la API no deja un 502 hasta reiniciar este contenedor.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;
    client_body_timeout 20s;
    client_header_timeout 20s;
    client_max_body_size 7m;          # albergues e incidentes: hasta 3 fotos JPEG (≤ 1,5 MB cada una)
    # IP real de cada persona (si no, todos los límites por IP cuentan la del proxy y un solo abusador, o una
    # crecida con muchos reportes, bloquea a todo el cantón). Delante están Cloudflare y el nginx del servidor:
    # solo se cree CF-Connecting-IP cuando la conexión viene de ellos (red privada de Docker o rangos de Cloudflare,
    # https://www.cloudflare.com/ips/). Sin esa cabecera (desarrollo local) queda la IP de la conexión.
    # Para que no se pueda falsificar, el firewall del servidor debe aceptar el 80/443 solo desde Cloudflare.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    # PWA: el manifiesto con su tipo; el service worker nunca se guarda en caché
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/seguridad.conf;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/seguridad.conf;
    }
    # archivos con hash del build: no cambian nunca
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/seguridad.conf;
        # capas del mapa de incidentes (el mime.types de nginx no conoce .geojson; un bloque types en el
        # server reemplazaría todo el mapa de tipos, por eso va solo aquí)
        location ~ \.geojson$ {
            types { }
            default_type application/geo+json;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/snippets/seguridad.conf;
        }
    }
    # index.html y los íconos: siempre se revalidan (así llega cada despliegue)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/seguridad.conf;
    }
}
