# Cabeceras de seguridad del panel (estrictas: nada indexable, nada en marcos ajenos).
# Externos permitidos: Cloudflare Turnstile (script y marco del ingreso), las teselas de OpenStreetMap (mapas) y el
# servicio de rutas de OpenStreetMap Alemania (routing.openstreetmap.de, «Ver ruta» del mapa en vivo del superadmin).
# HTTPS siempre (los navegadores la ignoran en http://localhost, así que no molesta en desarrollo)
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# geolocation=(self): el asistente de incidentes centra el mapa en el GPS del operador (con geolocation=() el navegador lo niega siempre)
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://routing.openstreetmap.de; font-src 'self' data:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
