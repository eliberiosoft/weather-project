# Yaguachi Weather · app ciudadana
# Registro sin IP ni parámetros de la URL (allí van coordenadas): la política de privacidad lo promete
log_format privado '$time_iso8601 "$request_method $uri" $status $body_bytes_sent';

server {
    access_log /dev/stdout privado;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # La API se resuelve por el DNS de Docker en cada petición (y no una sola vez al arrancar nginx):
    # así reconstruir o reiniciar la API no deja un 502 hasta reiniciar este contenedor.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;
    client_max_body_size 7m;          # reportes con hasta 3 fotos (el cliente las reduce a ~1024 px)
    client_body_timeout 20s;          # conexiones lentas a propósito no ocupan el servidor
    client_header_timeout 20s;
    # IP real de cada persona (si no, todos los límites por IP cuentan la del proxy y un solo abusador, o una
    # crecida con muchos reportes, bloquea a todo el cantón). Delante están Cloudflare y el nginx del servidor:
    # solo se cree CF-Connecting-IP cuando la conexión viene de ellos (red privada de Docker o rangos de Cloudflare,
    # https://www.cloudflare.com/ips/). Sin esa cabecera (desarrollo local) queda la IP de la conexión.
    # Para que no se pueda falsificar, el firewall del servidor debe aceptar el 80/443 solo desde Cloudflare.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # El panel del analista y su inicio de sesión NO se exponen desde la app ciudadana
    location = /api/panel { return 404; }
    location ^~ /api/panel/ { return 404; }
    location = /api/auth { return 404; }
    location ^~ /api/auth/ { return 404; }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # enlaces compartidos de avisos (vista previa con el flyer; redirigen a /#avisos/<id>, spec 021)
    location /a/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # enlaces compartidos de reportes (vista previa en Facebook y WhatsApp; redirigen a /#muro/<id>)
    location /r/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JS, CSS e imágenes del build llevan hash en el nombre: no cambian nunca, caché larga e inmutable
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/seguridad.conf;
    }
    # capas, manifiesto, íconos e index.html no llevan hash: siempre se revalidan (el service worker da el uso sin señal)
    location ~ \.geojson$ {
        default_type application/geo+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/seguridad.conf;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/seguridad.conf;
    }
    # CDN-Cache-Control: aunque Cloudflare tenga una regla de «cachear todo», index.html, sw.js y version.json no se
    # guardan en el borde: si no, un despliegue nuevo quedaría escondido para quien llega por la red de Cloudflare
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
        include /etc/nginx/snippets/seguridad.conf;
    }
    # el service worker no se cachea nunca (si no, una corrección tarda en llegar a los teléfonos)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        include /etc/nginx/snippets/seguridad.conf;
    }
    # el build publicado: la app lo pregunta para saber si hay un despliegue nuevo (features/pwa/version.ts)
    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        include /etc/nginx/snippets/seguridad.conf;
    }
}
