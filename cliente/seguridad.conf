# Cabeceras de seguridad de la app ciudadana. Se incluye en cada «location» que usa add_header
# (en nginx un add_header dentro de una location anula los del server; por eso va repetido con include).
# HSTS va aquí porque Cloudflare no lo estaba enviando (revisado el 2026-11-10).
# CSP (contrato v2 §9): todo el JS va empaquetado (Leaflet y Firebase incluidos; nada de unpkg ni gstatic).
# style-src 'unsafe-inline': React y Leaflet ponen estilos en atributos style (posiciones, colores de la leyenda).
# connect-src: teselas del mapa y, solo si activas las notificaciones, los servicios de Firebase Cloud Messaging.
# HTTPS siempre (los navegadores la ignoran en http://localhost, así que no molesta en desarrollo)
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://server.arcgisonline.com; connect-src 'self' https://tile.openstreetmap.org https://server.arcgisonline.com https://fcmregistrations.googleapis.com https://firebaseinstallations.googleapis.com https://fcm.googleapis.com https://www.googleapis.com; font-src 'self' data:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
