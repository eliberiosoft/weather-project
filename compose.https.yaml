# Solo desarrollo: la app por HTTPS en el puerto 8443 para probar la ubicación (GPS) desde un celular en la misma red.
#   sh iniciar-https.sh            → crea el certificado (mkcert) y levanta todo con este archivo
#   https://localhost:8443  ·  https://<IP de este equipo>:8443
# En el celular el certificado no es de confianza: hay que aceptar el aviso («Avanzado» → «Continuar»).
# En producción no se usa (ahí el HTTPS lo pone Cloudflare).
services:
  https:
    image: nginx:1.27-alpine
    depends_on:
      - cliente
    ports:
      - "${PUERTO_HTTPS:-8443}:8443"
    volumes:
      - ./dev/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secretos/https:/certs:ro
    restart: unless-stopped
