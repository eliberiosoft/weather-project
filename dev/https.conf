# HTTPS solo para desarrollo (compose.https.yaml): el celular en la misma red necesita HTTPS para dar la ubicación
# (el navegador solo la da en https:// o en localhost). Reenvía todo a la app (contenedor cliente), que a su vez
# reenvía /api a la API. Los certificados los crea iniciar-https.sh con mkcert en secretos/https/ (no se suben).
server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    client_max_body_size 7m;

    location / {
        proxy_pass http://cliente:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
